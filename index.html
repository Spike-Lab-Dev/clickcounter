<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Click Counter</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    button {
      font-size: 20px;
      padding: 10px 20px;
    }
    #count {
      font-size: 32px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>クリックカウンター</h1>
  <button onclick="countUp()">クリック！</button>
  <div id="count">0</div>

  <script>
    let count = 0;
    function countUp() {
      count++;
      document.getElementById("count").textContent = count;
    }
  </script>

</body>
</html>
